<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asbeeq — apps</title><meta name="description" content="Apps by Asbeeq.">
<style>
:root{--bg:#f7f7f8;--card:#fff;--text:#16171a;--muted:#5d636d;--accent:#d96a00;--line:#e3e4e8}
@media (prefers-color-scheme: dark){:root{--bg:#111214;--card:#1c1d21;--text:#eceef2;--muted:#9aa0aa;--accent:#ff9a3c;--line:#2a2c31}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 16px 64px}a{color:var(--accent)}
header{display:flex;align-items:center;gap:14px;margin-bottom:8px}header img{width:56px;height:56px;border-radius:13px}
h1{font-size:28px;margin:0}h2{font-size:21px;margin:32px 0 8px}h3{font-size:17px;margin:20px 0 6px}
.sub{color:var(--muted);margin:0 0 20px}.langs{display:flex;gap:8px;margin:12px 0 4px}
.langs a{padding:4px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--text);font-size:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 20px 16px;margin:16px 0}
li{margin:6px 0}footer{color:var(--muted);font-size:14px;margin-top:28px}
.links{display:grid;gap:10px;margin-top:16px}.links a{display:block;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--text)}
.links span{color:var(--muted);display:block;font-size:14px}
</style></head><body><main>
<h1>Apps</h1><p class="sub">Приложения</p><div class="links"><a href="groovic/">Groovic<span>Beat maker and music studio for iPhone</span></a></div>
</main></body></html>
